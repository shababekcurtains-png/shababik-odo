<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OdoNex | لوحة التحكم الإدارية</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            /* منع التمرير غير المرغوب فيه */
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            /* منع أي تأثيرات خارجية */
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.5s ease;
            /* منع أي تغيير في الحجم */
            transform: none !important;
            transition: none !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== قسم الشعار ===== */
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 15px;
            /* منع أي تأثيرات حركية */
            animation: none;
            transform: none;
        }

        .logo-section h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .logo-section .subtitle {
            color: #666;
            font-size: 15px;
            font-weight: 500;
        }

        /* ===== معلومات الدخول (حسب الصورة) ===== */
        .login-info {
            background: #f5f3ff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #e0e7ff;
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4f46e5;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #c7d2fe;
        }

        .info-header i {
            font-size: 20px;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e7ff;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #374151;
            width: 110px;
            font-size: 15px;
        }

        .info-value {
            color: #4f46e5;
            font-weight: 700;
            font-size: 16px;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #c7d2fe;
            flex: 1;
            text-align: center;
            letter-spacing: 1px;
        }

        .info-value.password {
            direction: ltr;
            font-family: monospace;
            font-size: 18px;
        }

        /* ===== حقول الإدخال ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        .input-wrapper {
            position: relative;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        .input-wrapper:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
            transition: color 0.2s;
        }

        .input-wrapper:focus-within i {
            color: #4f46e5;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #1f2937;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
            font-size: 14px;
        }

        /* ===== زر تسجيل الدخول ===== */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 25px 0 15px;
            /* منع أي تأثيرات حركية */
            transition: none;
            transform: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-login:active {
            opacity: 0.9;
        }

        .btn-login i {
            font-size: 18px;
        }

        /* ===== تنبيهات ===== */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .alert i {
            font-size: 18px;
        }

        /* ===== روابط إضافية ===== */
        .additional-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .additional-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .additional-links a:hover {
            color: #4f46e5;
        }

        /* منع أي تأثيرات JavaScript من تغيير الصفحة */
        .no-click {
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- الشعار -->
            <div class="logo-section">
                <img src="../assets/images/odonex-logo.png.png" alt="OdoNex Logo" 
                     onerror="this.src='https://via.placeholder.com/110x110?text=OdoNex'">
                <h1>OdoNex</h1>
                <div class="subtitle">لوحة التحكم الإدارية</div>
            </div>

            <!-- معلومات الدخول (كما في الصورة) -->
            <div class="login-info">
                <div class="info-header">
                    <i class="fas fa-key"></i>
                    <span>معلومات الدخول</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">اسم المستخدم</span>
                    <span class="info-value">admin</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">كلمة المرور</span>
                    <span class="info-value password">OdoNex2026</span>
                </div>
            </div>

            <!-- رسائل التنبيه -->
            <div id="errorAlert" class="alert alert-error" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>

            <div id="successAlert" class="alert alert-success" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span>تم تسجيل الدخول بنجاح!</span>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- حقل اسم المستخدم -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user" style="margin-left: 5px;"></i>
                        اسم المستخدم
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" 
                               id="username" 
                               name="username" 
                               placeholder="أدخل اسم المستخدم"
                               value="admin"
                               autocomplete="off">
                    </div>
                </div>

                <!-- حقل كلمة المرور -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" style="margin-left: 5px;"></i>
                        كلمة المرور
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               placeholder="أدخل كلمة المرور"
                               value="OdoNex2026">
                        <i class="fas fa-eye" 
                           id="togglePassword"
                           style="left: 15px; right: auto; cursor: pointer;"
                           onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- زر تسجيل الدخول -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>تسجيل الدخول</span>
                </button>
            </form>

            <!-- روابط إضافية -->
            <div class="additional-links">
                <a href="#" onclick="showHelp(event)">
                    <i class="fas fa-question-circle"></i>
                    مساعدة
                </a>
            </div>
        </div>
    </div>

    <script>
        // منع إعادة تحميل الصفحة عند أي حدث غير مرغوب
        window.addEventListener('beforeunload', function(e) {
            // لا نفعل شيئاً، فقط نمنع إعادة التحميل التلقائي
        });

        // دالة إظهار/إخفاء كلمة المرور
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // دالة معالجة تسجيل الدخول
        function handleLogin(event) {
            // منع إعادة تحميل الصفحة نهائياً
            event.preventDefault();
            event.stopPropagation();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // التحقق من البيانات (admin / OdoNex2026)
            if (username === 'admin' && password === 'OdoNex2026') {
                // إظهار رسالة النجاح
                document.getElementById('successAlert').style.display = 'flex';
                document.getElementById('errorAlert').style.display = 'none';
                
                // تخزين حالة تسجيل الدخول
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminUsername', username);
                
                // تحويل إلى لوحة التحكم بعد ثانية
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                // إظهار رسالة الخطأ
                document.getElementById('errorMessage').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
                document.getElementById('errorAlert').style.display = 'flex';
                document.getElementById('successAlert').style.display = 'none';
                
                // إخفاء الرسالة بعد 3 ثوان
                setTimeout(function() {
                    document.getElementById('errorAlert').style.display = 'none';
                }, 3000);
            }
            
            // منع أي سلوك افتراضي آخر
            return false;
        }

        // دالة المساعدة
        function showHelp(event) {
            event.preventDefault();
            alert('للحصول على المساعدة، يرجى التواصل مع مدير النظام');
        }

        // التحقق عند تحميل الصفحة
        window.onload = function() {
            // التحقق من وجود جلسة سابقة
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = 'index.html';
            }
            
            // تعيين القيم الافتراضية
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'OdoNex2026';
        };

        // منع إعادة تحميل الصفحة عند الضغط على Enter في الحقول
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin(e);
            }
        });

        // منع أي محاولة إعادة تحميل غير مقصودة
        document.addEventListener('keydown', function(e) {
            // منع F5 و Ctrl+R و Ctrl+Shift+R
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.shiftKey && e.key === 'r')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
