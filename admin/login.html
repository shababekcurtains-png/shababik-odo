<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | OdoNex</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* الخلفية المتحركة */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .background span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: animate 20s linear infinite;
            bottom: -150px;
        }

        .background span:nth-child(1) {
            left: 25%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
        }

        .background span:nth-child(2) {
            left: 10%;
            width: 15px;
            height: 15px;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .background span:nth-child(3) {
            left: 70%;
            width: 20px;
            height: 20px;
            animation-delay: 4s;
        }

        .background span:nth-child(4) {
            left: 40%;
            width: 45px;
            height: 45px;
            animation-delay: 0s;
            animation-duration: 18s;
        }

        .background span:nth-child(5) {
            left: 65%;
            width: 25px;
            height: 25px;
            animation-delay: 0s;
        }

        .background span:nth-child(6) {
            left: 75%;
            width: 80px;
            height: 80px;
            animation-delay: 3s;
        }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        .login-container {
            width: 100%;
            max-width: 350px; /* 70% من الحجم الأصلي (كان 450px) */
            z-index: 1;
            position: relative;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px 25px; /* تصغير الحشو */
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* الشعار */
        .logo-wrapper {
            text-align: center;
            margin-bottom: 25px; /* تقليل المسافة */
        }

        .logo-wrapper img {
            width: 90px; /* تصغير الشعار */
            height: 90px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 8px 15px rgba(102, 126, 234, 0.3));
        }

        .logo-wrapper h1 {
            font-size: 26px; /* تصغير الخط */
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3px;
        }

        .logo-wrapper p {
            color: #666;
            font-size: 12px; /* تصغير الخط */
            font-weight: 500;
        }

        /* حقول الإدخال */
        .form-group {
            margin-bottom: 18px; /* تقليل المسافة */
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px; /* تصغير الخط */
            color: #374151;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            border: 2px solid #e5e7eb;
            border-radius: 14px; /* تقليل الانحناء */
            transition: all 0.3s ease;
            background: white;
        }

        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            right: 15px; /* تقليل المسافة */
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px; /* تصغير الأيقونة */
            transition: color 0.3s;
        }

        .input-wrapper:focus-within i {
            color: #667eea;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 45px 14px 15px; /* تقليل الحشو */
            border: none;
            background: transparent;
            font-size: 15px; /* تصغير الخط */
            color: #1f2937;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
            font-size: 13px; /* تصغير الخط */
        }

        /* إزالة التعبئة المسبقة */
        .input-wrapper input:not(:focus) {
            background: transparent;
        }

        /* زر إظهار/إخفاء كلمة المرور */
        .toggle-password {
            position: absolute;
            left: 15px; /* تقليل المسافة */
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px; /* تصغير الأيقونة */
            transition: color 0.3s;
            z-index: 2;
        }

        .toggle-password:hover {
            color: #667eea;
        }

        /* خيارات إضافية */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px; /* تقليل المسافة */
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 16px; /* تصغير حجم checkbox */
            height: 16px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .remember-me span {
            font-size: 13px; /* تصغير الخط */
            color: #4b5563;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-size: 13px; /* تصغير الخط */
            font-weight: 600;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: #764ba2;
        }

        /* زر تسجيل الدخول */
        .btn-login {
            width: 100%;
            padding: 14px; /* تقليل الحشو */
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 14px; /* تقليل الانحناء */
            font-size: 16px; /* تصغير الخط */
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 8px 15px -5px rgba(102, 126, 234, 0.4);
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(102, 126, 234, 0.5);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-login i {
            font-size: 16px;
        }

        /* رسالة الخطأ */
        .alert {
            padding: 12px 16px; /* تقليل الحشو */
            border-radius: 10px;
            margin-bottom: 18px; /* تقليل المسافة */
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px; /* تصغير الخط */
            font-weight: 500;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert i {
            font-size: 16px;
        }

        /* معلومات إضافية */
        .info-text {
            text-align: center;
            margin-top: 18px; /* تقليل المسافة */
            padding-top: 15px; /* تقليل المسافة */
            border-top: 1px solid #e5e7eb;
        }

        .info-text p {
            color: #6b7280;
            font-size: 12px; /* تصغير الخط */
        }

        /* أيقونة العودة */
        .back-link {
            position: absolute;
            top: 25px;
            right: 25px;
            color: white;
            text-decoration: none;
            font-size: 22px;
            opacity: 0.8;
            transition: opacity 0.3s;
            z-index: 2;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* منع التعبئة التلقائية للمتصفح */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #1f2937 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                max-width: 300px; /* أصغر للشاشات الصغيرة */
            }
            
            .login-card {
                padding: 25px 20px;
            }
            
            .logo-wrapper img {
                width: 80px;
                height: 80px;
            }
            
            .options-row {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- رابط العودة للصفحة الرئيسية -->
    <a href="../index.html" class="back-link">
        <i class="fas fa-arrow-right"></i>
    </a>

    <!-- الخلفية المتحركة -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="login-container">
        <div class="login-card">
            <!-- الشعار -->
            <div class="logo-wrapper">
                <img src="../assets/images/odonex-logo.png.png" alt="OdoNex Logo" 
                     onerror="this.src='https://via.placeholder.com/90x90?text=OdoNex'">
                <h1>OdoNex</h1>
                <p>لوحة التحكم الإدارية</p>
            </div>

            <!-- رسالة الخطأ -->
            <div id="errorAlert" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm">
                <!-- حقل اسم المستخدم -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user" style="margin-left: 4px;"></i>
                        اسم المستخدم
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" 
                               id="username" 
                               name="username" 
                               placeholder="أدخل اسم المستخدم"
                               autocomplete="off"
                               spellcheck="false"
                               value="">
                    </div>
                </div>

                <!-- حقل كلمة المرور -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" style="margin-left: 4px;"></i>
                        كلمة المرور
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               placeholder="أدخل كلمة المرور"
                               autocomplete="off"
                               value="">
                        <i class="fas fa-eye toggle-password" 
                           id="togglePassword"></i>
                    </div>
                </div>

                <!-- خيارات إضافية -->
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="forgot-link" id="forgotLink">
                        نسيت كلمة المرور؟
                    </a>
                </div>

                <!-- زر تسجيل الدخول -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>تسجيل الدخول</span>
                </button>
            </form>

            <!-- نص إضافي (بدون ذكر البيانات) -->
            <div class="info-text">
                <p>
                    <i class="fas fa-shield-alt" style="margin-left: 4px;"></i>
                    هذه الصفحة مخصصة للمشرفين فقط
                </p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // منع إعادة تحميل الصفحة عند أي حدث غير مرغوب
            if (window.location.protocol === 'file:') {
                // منع السلوك الغريب في الملفات المحلية
            }

            // عناصر الصفحة
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const loginBtn = document.getElementById('loginBtn');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const forgotLink = document.getElementById('forgotLink');
            const rememberMeCheck = document.getElementById('rememberMe');

            // إفراغ الحقول تماماً
            usernameInput.value = '';
            passwordInput.value = '';

            // منع أي تعبئة تلقائية من المتصفح
            setTimeout(() => {
                usernameInput.value = '';
                passwordInput.value = '';
            }, 50);

            // إظهار/إخفاء كلمة المرور
            togglePasswordBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePasswordBtn.classList.remove('fa-eye');
                    togglePasswordBtn.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    togglePasswordBtn.classList.remove('fa-eye-slash');
                    togglePasswordBtn.classList.add('fa-eye');
                }
            });

            // إظهار رسالة الخطأ
            function showError(message) {
                errorMessage.textContent = message;
                errorAlert.style.display = 'flex';
                
                // إخفاء الرسالة بعد 3 ثوان
                setTimeout(() => {
                    errorAlert.style.display = 'none';
                }, 3000);
            }

            // معالجة تسجيل الدخول
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                
                // التحقق من الحقول الفارغة
                if (!username) {
                    showError('الرجاء إدخال اسم المستخدم');
                    usernameInput.focus();
                    return;
                }
                
                if (!password) {
                    showError('الرجاء إدخال كلمة المرور');
                    passwordInput.focus();
                    return;
                }
                
                // تعطيل الزر أثناء المعالجة
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارِ التحقق...';
                
                // محاكاة تأخير بسيط
                setTimeout(() => {
                    // التحقق من البيانات (يتم التحقق هنا بدون ذكرها)
                    if (username === 'admin' && password === 'OdoNex2026') {
                        
                        // حفظ الجلسة
                        if (rememberMeCheck.checked) {
                            localStorage.setItem('adminLoggedIn', 'true');
                            localStorage.setItem('adminUsername', username);
                        } else {
                            sessionStorage.setItem('adminLoggedIn', 'true');
                            sessionStorage.setItem('adminUsername', username);
                        }
                        
                        // تغيير رسالة الزر
                        loginBtn.innerHTML = '<i class="fas fa-check"></i> تم بنجاح! جارِ التحويل...';
                        
                        // تحويل بعد ثانية
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                        
                    } else {
                        // فشل تسجيل الدخول
                        showError('اسم المستخدم أو كلمة المرور غير صحيحة');
                        
                        // إعادة الزر لحالته الطبيعية
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
                        
                        // تفريغ الحقول (اختياري)
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }, 800);
            });

            // دالة المساعدة (نسيت كلمة المرور)
            forgotLink.addEventListener('click', function(e) {
                e.preventDefault();
                showError('للحصول على المساعدة، يرجى التواصل مع مدير النظام');
            });

            // التحقق من وجود جلسة سابقة
            if (localStorage.getItem('adminLoggedIn') === 'true' || 
                sessionStorage.getItem('adminLoggedIn') === 'true') {
                // تحويل مباشر إلى لوحة التحكم
                window.location.href = 'index.html';
            }

            // منع إعادة تحميل الصفحة عند الضغط على Enter
            usernameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    passwordInput.focus();
                }
            });

            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

            // منع النسخ واللصق في حقل كلمة المرور (أمان إضافي)
            passwordInput.addEventListener('copy', function(e) {
                e.preventDefault();
            });

            passwordInput.addEventListener('paste', function(e) {
                e.preventDefault();
            });

            passwordInput.addEventListener('cut', function(e) {
                e.preventDefault();
            });

            // مراقبة التغييرات لمنع التعبئة التلقائية
            const observer = new MutationObserver(function() {
                if (usernameInput.value !== '' && !usernameInput.value.startsWith('admin')) {
                    // يمكن إضافة منطق إضافي هنا
                }
            });

            observer.observe(usernameInput, { attributes: true, attributeFilter: ['value'] });

            // تنظيف عند الخروج
            window.addEventListener('beforeunload', function() {
                // لا حاجة لتنظيف خاص
            });

            console.log('صفحة تسجيل الدخول جاهزة - الحقول فارغة');
        })();
    </script>
</body>
</html>
