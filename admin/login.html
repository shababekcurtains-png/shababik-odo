<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | OdoNex</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* الخلفية المتحركة */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .background span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: animate 20s linear infinite;
            bottom: -150px;
        }

        .background span:nth-child(1) {
            left: 25%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }

        .background span:nth-child(2) {
            left: 10%;
            width: 20px;
            height: 20px;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .background span:nth-child(3) {
            left: 70%;
            width: 20px;
            height: 20px;
            animation-delay: 4s;
        }

        .background span:nth-child(4) {
            left: 40%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
            animation-duration: 18s;
        }

        .background span:nth-child(5) {
            left: 65%;
            width: 20px;
            height: 20px;
            animation-delay: 0s;
        }

        .background span:nth-child(6) {
            left: 75%;
            width: 110px;
            height: 110px;
            animation-delay: 3s;
        }

        @keyframes animate {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 0;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
                border-radius: 50%;
            }
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            z-index: 1;
            position: relative;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.8s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* الشعار */
        .logo-wrapper {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-wrapper img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(102, 126, 234, 0.3));
        }

        .logo-wrapper h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .logo-wrapper p {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        /* حقول الإدخال */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-wrapper i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
            transition: color 0.3s;
        }

        .input-wrapper:focus-within i {
            color: #667eea;
        }

        .input-wrapper input {
            width: 100%;
            padding: 18px 50px 18px 20px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #1f2937;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
            font-size: 14px;
        }

        /* زر إظهار/إخفاء كلمة المرور */
        .toggle-password {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #667eea;
        }

        /* خيارات إضافية */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .remember-me span {
            font-size: 14px;
            color: #4b5563;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: #764ba2;
        }

        /* زر تسجيل الدخول */
        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(102, 126, 234, 0.5);
        }

        .btn-login i {
            font-size: 18px;
        }

        /* رسالة الخطأ */
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert i {
            font-size: 18px;
        }

        /* معلومات إضافية */
        .info-text {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .info-text p {
            color: #6b7280;
            font-size: 13px;
        }

        .info-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .info-text a:hover {
            text-decoration: underline;
        }

        /* أيقونة العودة */
        .back-link {
            position: absolute;
            top: 30px;
            right: 30px;
            color: white;
            text-decoration: none;
            font-size: 24px;
            opacity: 0.8;
            transition: opacity 0.3s;
            z-index: 2;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 40px 25px;
            }
            
            .logo-wrapper img {
                width: 100px;
                height: 100px;
            }
            
            .options-row {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- رابط العودة للصفحة الرئيسية -->
    <a href="../index.html" class="back-link">
        <i class="fas fa-arrow-right"></i>
    </a>

    <!-- الخلفية المتحركة -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="login-container">
        <div class="login-card">
            <!-- الشعار -->
            <div class="logo-wrapper">
                <img src="../assets/images/odonex-logo.png.png" alt="OdoNex Logo">
                <h1>OdoNex</h1>
                <p>لوحة التحكم الإدارية</p>
            </div>

            <!-- رسالة الخطأ -->
            <div id="errorAlert" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- حقل اسم المستخدم -->
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user" style="margin-left: 5px;"></i>
                        اسم المستخدم
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" 
                               id="username" 
                               name="username" 
                               placeholder="أدخل اسم المستخدم"
                               autocomplete="off"
                               autofocus>
                    </div>
                </div>

                <!-- حقل كلمة المرور -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" style="margin-left: 5px;"></i>
                        كلمة المرور
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               placeholder="أدخل كلمة المرور">
                        <i class="fas fa-eye toggle-password" 
                           id="togglePassword"
                           onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- خيارات إضافية -->
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="showHelp(event)">
                        نسيت كلمة المرور؟
                    </a>
                </div>

                <!-- زر تسجيل الدخول -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>تسجيل الدخول</span>
                </button>
            </form>

            <!-- نص إضافي (بدون ذكر البيانات) -->
            <div class="info-text">
                <p>
                    <i class="fas fa-shield-alt" style="margin-left: 5px;"></i>
                    هذه الصفحة مخصصة للمشرفين فقط
                </p>
            </div>
        </div>
    </div>

    <script>
        // التحقق من أن الصفحة تعمل بشكل آمن
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }

        // إظهار/إخفاء كلمة المرور
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // إظهار رسالة الخطأ
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = message;
            errorAlert.style.display = 'flex';
            
            // إخفاء الرسالة بعد 3 ثوان
            setTimeout(() => {
                errorAlert.style.display = 'none';
            }, 3000);
        }

        // معالجة تسجيل الدخول
        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // التحقق من الحقول الفارغة
            if (!username || !password) {
                showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }
            
            // التحقق من البيانات (هنا يتم التحقق بدون ذكرها في الواجهة)
            if (username === 'admin' && password === 'OdoNex2026') {
                // حفظ الجلسة
                if (rememberMe) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminUsername', username);
                } else {
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminUsername', username);
                }
                
                // رسالة نجاح وتحويل
                showSuccessAndRedirect();
            } else {
                showError('اسم المستخدم أو كلمة المرور غير صحيحة');
            }
        }

        // إظهار نجاح وتحويل
        function showSuccessAndRedirect() {
            // تغيير شكل الزر مؤقتاً
            const loginBtn = document.getElementById('loginBtn');
            const originalText = loginBtn.innerHTML;
            
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارِ التحويل...';
            loginBtn.disabled = true;
            
            // تحويل بعد ثانية
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }

        // دالة المساعدة (نسيت كلمة المرور)
        function showHelp(event) {
            event.preventDefault();
            showError('للحصول على المساعدة، يرجى التواصل مع مدير النظام');
        }

        // التحقق من وجود جلسة سابقة
        window.onload = function() {
            if (localStorage.getItem('adminLoggedIn') === 'true' || 
                sessionStorage.getItem('adminLoggedIn') === 'true') {
                window.location.href = 'index.html';
            }
            
            // إضافة تأثيرات للخلفية
            console.log('صفحة تسجيل الدخول جاهزة');
        };

        // منع إعادة تحميل الصفحة عند الضغط على Enter
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin(e);
            }
        });

        // منع النسخ واللصق في حقل كلمة المرور (أمان إضافي)
        document.getElementById('password').addEventListener('copy', function(e) {
            e.preventDefault();
        });

        document.getElementById('password').addEventListener('paste', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
